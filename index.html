<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel NVR Profissional</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --btn-blue: #1f6feb;
            --alert-red: #da3633;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
        }

        /* Navegação / Tabs */
        .navbar {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h2 { margin: 0; color: var(--accent-blue); }
        .tabs { display: flex; gap: 15px; }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .tab-btn.active { color: white; background: var(--border-color); }
        .tab-btn:hover:not(.active) { color: white; }

        /* Estrutura Principal */
        .container { padding: 20px 30px; display: none; }
        .container.active { display: block; }

        /* Elementos UI */
        .card { 
            background-color: var(--bg-panel); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            margin-bottom: 20px;
        }
        input, select { 
            width: 100%; padding: 10px; margin-bottom: 15px; 
            border: 1px solid var(--border-color); border-radius: 6px; 
            box-sizing: border-box; background: var(--bg-dark); color: var(--text-main);
        }
        input:focus, select:focus { border-color: var(--accent-blue); outline: none;}
        label { font-size: 12px; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 5px;}
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-blue { background-color: var(--btn-blue); color: white; }
        .btn-blue:hover { filter: brightness(1.2); }
        .btn-outline { border: 1px solid var(--text-muted); background: transparent; color: var(--text-main); }
        .btn-outline:hover { background: var(--border-color); }

        /* Mosaico Grid */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .cam-box { 
            background-color: #000; border-radius: 10px; overflow: hidden; 
            border: 1px solid var(--border-color); position: relative; 
            display: flex; flex-direction: column;
        }
        .cam-header { 
            position: absolute; top: 0; left: 0; width: 100%; padding: 10px; 
            background: linear-gradient(rgba(0,0,0,0.8), transparent); 
            display: flex; justify-content: space-between; align-items: center; 
            box-sizing: border-box; pointer-events: none;
        }
        .cam-title { color: white; font-weight: bold; font-size: 14px; margin:0; text-shadow: 1px 1px 2px black;}
        .cam-feed { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111; }
        
        .badge { padding: 4px 8px; border-radius: 12px; color: white; font-size: 10px; font-weight: bold;}
        .bg-red { background-color: var(--alert-red); animation: blink 2s infinite;}
        @keyframes blink { 50% { opacity: 0.6; } }

        /* Timeline / Player */
        .timeline-layout { display: flex; gap: 20px; flex-wrap: wrap; }
        .player-section { flex: 3; min-width: 400px; }
        .playlist-section { flex: 1; min-width: 250px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; height: 600px; overflow-y: auto;}
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; border: 1px solid var(--border-color); }
        
        .playlist-item { 
            padding: 10px; border-bottom: 1px solid var(--border-color); 
            cursor: pointer; display: flex; justify-content: space-between; font-size: 13px;
        }
        .playlist-item:hover { background: var(--border-color); }
        .playlist-item.active { border-left: 4px solid var(--accent-blue); background: #1f242b; }

        /* Modal */
        .modal-bg { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-panel); padding: 25px; border-radius: 12px; width: 400px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>📷 NVR Cloud</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('live')">Ao Vivo</button>
            <button class="tab-btn" onclick="mudarAba('timeline')">Gravações</button>
            <button class="tab-btn" onclick="mudarAba('config')">Configurações</button>
        </div>
    </div>

    <div id="tab-live" class="container active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>Visão Geral</h3>
            <button class="btn btn-blue" onclick="abrirModalAdd()">➕ Adicionar Câmara</button>
        </div>
        <div id="mosaico-grid" class="grid-container">
            <!-- Câmaras ao vivo aparecerão aqui -->
        </div>
    </div>

    <div id="tab-timeline" class="container">
        <h3>Navegador de Gravações (Google Drive)</h3>
        <div class="timeline-layout">
            <div class="player-section">
                <!-- Dropdowns para filtrar -->
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <div style="flex:1;">
                        <label>Data</label>
                        <select id="filter-date" onchange="carregarPlaylist()"></select>
                    </div>
                    <div style="flex:1;">
                        <label>Câmara</label>
                        <select id="filter-cam" onchange="carregarPlaylist()"></select>
                    </div>
                </div>
                <!-- Player de Vídeo -->
                <video id="timeline-player" controls autoplay></video>
                <p id="now-playing" style="font-size: 14px; color: var(--accent-blue); font-weight: bold;"></p>
            </div>
            
            <div class="playlist-section">
                <h4 style="margin-top: 0; color: var(--text-muted);">Segmentos de 1 Minuto</h4>
                <div id="playlist-container">
                    <!-- Segmentos de vídeo aparecerão aqui -->
                </div>
            </div>
        </div>
    </div>

    <div id="tab-config" class="container">
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <h3>⚙️ Ligação ao Motor Python</h3>
            <p style="font-size: 13px; color: var(--text-muted);">
                Como este site está alojado separadamente (ex: GitHub), informe o IP e a porta local onde o seu <b>Nvr.py</b> está a correr.
            </p>
            <label>URL do Backend NVR</label>
            <input type="text" id="api-url" placeholder="Ex: http://192.168.0.30:5000">
            <button class="btn btn-blue" style="width: 100%;" onclick="salvarConfig()">Gravar e Conectar</button>
            <div id="status-conexao" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </div>
        
        <div class="card" style="max-width: 500px; margin: 20px auto 0;">
             <h3>🗑️ Gestão de Câmaras</h3>
             <div id="camera-list-config"></div>
        </div>
    </div>

    <!-- Modal Adicionar Câmara -->
    <div id="modal-add" class="modal-bg">
        <div class="modal-content">
            <h3>Adicionar Nova Câmara</h3>
            
            <button id="btn-scan" class="btn btn-outline" style="width: 100%; margin-bottom: 15px;" onclick="escanearRede()">🔍 Procurar na Rede Local</button>
            <div id="scan-results" style="font-size: 12px; margin-bottom: 15px; max-height: 100px; overflow-y: auto;"></div>
            
            <label>IP e Porta (Manual ou Scanner)</label>
            <input type="text" id="cam-ip" placeholder="Ex: 192.168.0.160:8080">
            
            <div style="display: flex; gap: 10px;">
                <div style="flex:1;">
                    <label>Utilizador</label>
                    <input type="text" id="cam-user" placeholder="admin">
                </div>
                <div style="flex:1;">
                    <label>Senha</label>
                    <input type="password" id="cam-pass">
                </div>
            </div>
            
            <label>Nome da Câmara</label>
            <input type="text" id="cam-name" placeholder="Ex: Garagem">
            
            <p id="add-status" style="font-size: 12px; font-weight: bold; color: var(--accent-blue);"></p>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-blue" style="flex: 1;" onclick="descobrirEAdicionar()">Testar e Guardar</button>
                <button class="btn btn-outline" style="flex: 1;" onclick="fecharModalAdd()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // Gestão de URL da API (Para funcionar no Github Pages)
        function getApiUrl() {
            return localStorage.getItem('nvr_api_url') || '';
        }

        function salvarConfig() {
            const url = document.getElementById('api-url').value.trim();
            if(url.endsWith('/')) url = url.slice(0, -1); // Remove barra final
            localStorage.setItem('nvr_api_url', url);
            testarConexao();
        }

        async function testarConexao() {
            const statusDiv = document.getElementById('status-conexao');
            const apiUrl = getApiUrl();
            if(!apiUrl) {
                statusDiv.innerHTML = "<span style='color: var(--alert-red);'>⚠️ Configure o URL primeiro.</span>";
                return;
            }
            
            statusDiv.innerHTML = "A testar ligação...";
            try {
                // Tenta buscar a lista de câmeras para ver se o backend responde
                const res = await fetch(`${apiUrl}/api/cameras`);
                if(res.ok) {
                    statusDiv.innerHTML = "<span style='color: #56d364;'>✅ Conectado com Sucesso!</span>";
                    carregarTudo();
                } else {
                    throw new Error("Erro");
                }
            } catch(e) {
                statusDiv.innerHTML = "<span style='color: var(--alert-red);'>❌ Falha ao conectar. Verifique o IP e Porta.</span>";
            }
        }

        // Gestão de Navegação
        function mudarAba(aba) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${aba}`).classList.add('active');
            
            if(aba === 'timeline') prepararTimeline();
        }

        // ================= CÂMARAS E MOSAICO =================
        let camerasGlobais = [];

        async function carregarTudo() {
            const apiUrl = getApiUrl();
            if(!apiUrl) return;
            
            try {
                const res = await fetch(`${apiUrl}/api/cameras`);
                camerasGlobais = await res.json();
                renderizarMosaico();
                renderizarListaConfig();
            } catch(e) { console.log("Aguardando Backend..."); }
        }

        function renderizarMosaico() {
            const grid = document.getElementById('mosaico-grid');
            const apiUrl = getApiUrl();
            grid.innerHTML = '';
            
            if(camerasGlobais.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding: 50px; color: var(--text-muted);">Nenhuma câmara configurada. Vá a 'Adicionar Câmara'.</div>`;
                return;
            }

            // O backend agora grava automaticamente 24/7. Exibimos apenas a imagem e o Badge.
            camerasGlobais.forEach(cam => {
                const liveUrl = `${apiUrl}/api/live?url=${encodeURIComponent(cam.url)}`;
                grid.innerHTML += `
                    <div class="cam-box">
                        <div class="cam-header">
                            <h3 class="cam-title">${cam.name}</h3>
                            <span class="badge bg-red">🔴 GRAVAÇÃO 24/7</span>
                        </div>
                        <img class="cam-feed" src="${liveUrl}" onerror="this.src='https://placehold.co/640x360/111/444?text=Sinal+Perdido'">
                    </div>
                `;
            });
        }

        function renderizarListaConfig() {
            const list = document.getElementById('camera-list-config');
            list.innerHTML = '';
            camerasGlobais.forEach(cam => {
                list.innerHTML += `
                    <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border-color);">
                        <span><b>${cam.name}</b> <br><small style="color:var(--text-muted)">${cam.url.substring(0, 30)}...</small></span>
                        <button class="btn btn-outline" style="color: var(--alert-red);" onclick="removerCamara('${cam.id}')">Apagar</button>
                    </div>
                `;
            });
        }

        // ================= ADICIONAR E DISCOVERY =================
        function abrirModalAdd() { 
            document.getElementById('modal-add').style.display = 'flex'; 
            document.getElementById('add-status').innerText = "";
        }
        function fecharModalAdd() { document.getElementById('modal-add').style.display = 'none'; }

        // Scanner de Rede
        async function escanearRede() {
            const apiUrl = getApiUrl();
            const btn = document.getElementById('btn-scan');
            const results = document.getElementById('scan-results');
            
            btn.innerText = "A varrer a rede..."; btn.disabled = true;
            results.innerHTML = "A procurar...";
            
            try {
                const res = await fetch(`${apiUrl}/api/scan`);
                const devices = await res.json();
                
                results.innerHTML = "";
                if(devices.length === 0) { results.innerHTML = "Nenhum dispositivo encontrado."; }
                else {
                    devices.forEach(d => {
                        results.innerHTML += `
                            <div style="display:flex; justify-content:space-between; margin-bottom:5px; padding:5px; background:var(--bg-dark); border-radius:4px;">
                                <span>${d.ip}:${d.port}</span>
                                <button class="btn btn-blue" style="padding:2px 8px; font-size:11px;" onclick="selecionarIP('${d.ip}', ${d.port})">Usar</button>
                            </div>
                        `;
                    });
                }
            } catch(e) { results.innerHTML = "Erro no scanner."; }
            btn.innerText = "🔍 Procurar na Rede Local"; btn.disabled = false;
        }

        function selecionarIP(ip, port) {
            document.getElementById('cam-ip').value = `${ip}:${port}`;
        }

        // Auto-Discovery Inteligente (Nova Versão)
        async function descobrirEAdicionar() {
            const apiUrl = getApiUrl();
            const ipPort = document.getElementById('cam-ip').value.trim();
            const user = document.getElementById('cam-user').value.trim();
            const pass = document.getElementById('cam-pass').value.trim();
            const name = document.getElementById('cam-name').value.trim();
            const statusLabel = document.getElementById('add-status');

            if(!ipPort || !name) { statusLabel.innerText = "Preencha o IP/Porta e o Nome."; return; }

            // Separa IP e Porta
            const partes = ipPort.split(':');
            const ip = partes[0];
            const port = partes.length > 1 ? partes[1] : "554";

            statusLabel.innerHTML = "A testar caminhos de vídeo RTSP. Aguarde...";
            
            try {
                const res = await fetch(`${apiUrl}/api/find_path`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ ip, port, user, password: pass })
                });
                
                const data = await res.json();
                if(data.success) {
                    statusLabel.innerHTML = "<span style='color: #56d364;'>Vídeo encontrado! A guardar...</span>";
                    // Adiciona a câmara com a URL oficial encontrada
                    await fetch(`${apiUrl}/api/cameras`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ name: name, url: data.url })
                    });
                    fecharModalAdd();
                    carregarTudo();
                } else {
                    statusLabel.innerHTML = "<span style='color: var(--alert-red);'>Falhou. Verifique Senha/IP.</span>";
                }
            } catch(e) {
                statusLabel.innerHTML = "<span style='color: var(--alert-red);'>Erro de comunicação com Python.</span>";
            }
        }

        async function removerCamara(id) {
            if(confirm("Remover esta câmara?")) {
                await fetch(`${getApiUrl()}/api/cameras?id=${id}`, { method: 'DELETE' });
                carregarTudo();
            }
        }

        // ================= TIMELINE E REPRODUÇÃO =================
        let dbGravações = [];
        let playlistAtual = [];
        let indexTocando = 0;

        async function prepararTimeline() {
            const apiUrl = getApiUrl();
            if(!apiUrl) return;
            try {
                const res = await fetch(`${apiUrl}/api/timeline`);
                dbGravações = await res.json();
                preencherFiltros();
            } catch(e) { console.log("Erro a carregar timeline."); }
        }

        function preencherFiltros() {
            const selectData = document.getElementById('filter-date');
            const selectCam = document.getElementById('filter-cam');
            
            // Extrair datas e câmaras únicas
            const datas = [...new Set(dbGravações.map(g => g.date))].sort().reverse();
            const cams = [...new Set(dbGravações.map(g => g.cam_name))].sort();

            selectData.innerHTML = datas.map(d => `<option value="${d}">${d}</option>`).join('');
            selectCam.innerHTML = cams.map(c => `<option value="${c}">${c.replace(/_/g, ' ')}</option>`).join('');
            
            if(datas.length > 0 && cams.length > 0) carregarPlaylist();
        }

        function carregarPlaylist() {
            const dataEscolhida = document.getElementById('filter-date').value;
            const camEscolhida = document.getElementById('filter-cam').value;
            const container = document.getElementById('playlist-container');
            
            // Filtrar na BD e ordenar por tempo
            playlistAtual = dbGravações.filter(g => g.date === dataEscolhida && g.cam_name === camEscolhida);
            playlistAtual.sort((a, b) => a.timestamp - b.timestamp);
            
            container.innerHTML = '';
            if(playlistAtual.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align:center;">Sem gravações.</p>';
                return;
            }

            playlistAtual.forEach((clip, index) => {
                container.innerHTML += `
                    <div class="playlist-item" id="clip-${index}" onclick="reproduzirVideo(${index})">
                        <span>▶️ ${clip.time}</span>
                    </div>
                `;
            });

            // Auto-play no primeiro clipe da lista
            reproduzirVideo(0);
        }

        function reproduzirVideo(index) {
            if(index >= playlistAtual.length) return; // Fim da lista do dia
            
            indexTocando = index;
            const clip = playlistAtual[index];
            const player = document.getElementById('timeline-player');
            const labelTitle = document.getElementById('now-playing');
            
            // Remove destaque de todos e adiciona no atual
            document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`clip-${index}`);
            if(activeItem) {
                activeItem.classList.add('active');
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            labelTitle.innerText = `A reproduzir: ${clip.cam_name} às ${clip.time}`;
            
            // O truque da CDN: Transmite direto dos servidores do Google usando o ID público
            player.src = `https://drive.google.com/uc?export=download&id=${clip.id}`;
            player.play();
        }

        // A MÁGICA DO VÍDEO CONTÍNUO: Quando o segmento de 60s acaba, passa pro próximo
        document.getElementById('timeline-player').addEventListener('ended', () => {
            reproduzirVideo(indexTocando + 1);
        });

        // Inicialização
        document.getElementById('api-url').value = getApiUrl();
        if(getApiUrl()) testarConexao();
        else mudarAba('config'); // Obriga o utilizador a configurar o IP primeiro
        
    </script>
</body>
</html>
